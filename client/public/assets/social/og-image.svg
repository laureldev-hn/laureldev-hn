      <text x="68" y="7" fill="#ffffff" fill-opacity="0.7" font-family="Montserrat, Arial, sans-serif"
            font-size="20" font-weight="600" letter-spacing="3.4">SOCIO TECNOLÓGICO DE LA BANCA Y LAS COOPERATIVAS</text>
    </g>

    <text y="110" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="66" font-weight="700">
      Tecnología de grado bancario
    </text>
    <text y="192" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="66" font-weight="700">
      para instituciones que
    </text>
    <text y="274" fill="#ffffff" font-family="Montserrat, Arial, sans-serif" font-size="66" font-weight="700">
